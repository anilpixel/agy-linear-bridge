name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: npm ci

      - name: Validate Python scripts
        run: >
          python3 -m py_compile
          scripts/launch_remote_agent.py
          scripts/watch_remote_agent.py
          scripts/cancel_remote_agent.py
          scripts/provision_remote_projects.py

      - name: Build Cloudflare Edge Worker bundle
        run: npx cf build

      - name: Run unit & edge integration tests
        run: npm test
